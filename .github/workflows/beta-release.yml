name: Beta Release

on:
  pull_request:
    types: [closed]
    branches:
      - beta
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & package only — draft release, no version bump/push'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: Bump Beta Version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'skip-release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bump beta version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BASE=$(node -p "require('./package.json').version.replace(/-.*$/, '')")
          BUMPED=$(node -p "const v='${BASE}'.split('.'); v[2]=parseInt(v[2])+1; v.join('.')")
          VERSION="${BUMPED}-beta"
          npm version "${VERSION}" --no-git-tag-version
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run — skipping commit & push of ${VERSION}"
          else
            git add package.json package-lock.json
            git commit -m "chore: bump version to ${VERSION}"
            git push origin beta
          fi

  sync-develop:
    name: Sync develop with beta
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Merge beta into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge origin/beta --ff-only
          git push origin develop

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            script: release:linux
            artifact-pattern: |
              dist/*.tar.gz
              dist/*.AppImage
              dist/beta-linux.yml

          - name: Linux arm64
            runner: ubuntu-24.04-arm
            script: release:linux-arm64
            artifact-pattern: |
              dist/*.tar.gz
              dist/*.AppImage
              dist/beta-linux-arm64.yml

          - name: Windows
            runner: windows-latest
            script: release:windows
            artifact-pattern: |
              dist/*.exe
              dist/*.zip
              dist/beta.yml

          - name: macOS universal
            runner: macos-latest
            script: release:mac-universal
            mac-universal: true
            artifact-pattern: |
              dist/*.dmg
              dist/beta-mac.yml

          - name: macOS x86_legacy
            runner: macos-15-intel
            script: release:mac-x64
            electron-version: '37'
            arch-suffix: x86_legacy
            artifact-pattern: dist/*-x86_legacy.dmg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          submodules: recursive

      - name: Build ${{ matrix.name }}
        uses: ./.github/actions/build-app
        with:
          script: ${{ matrix.script }}
          electron-version: ${{ matrix.electron-version }}
          mac-universal: ${{ matrix.mac-universal }}
          arch-suffix: ${{ matrix.arch-suffix }}

      - name: Generate beta channel yml files
        shell: bash
        run: |
          [ -f dist/latest-linux.yml ]       && cp dist/latest-linux.yml       dist/beta-linux.yml       || true
          [ -f dist/latest-linux-arm64.yml ] && cp dist/latest-linux-arm64.yml dist/beta-linux-arm64.yml || true
          [ -f dist/latest-mac.yml ]         && cp dist/latest-mac.yml         dist/beta-mac.yml         || true
          [ -f dist/latest.yml ]             && cp dist/latest.yml             dist/beta.yml             || true

      - name: List dist directory
        shell: bash
        run: ls -la dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: warn

  release:
    name: Create Beta Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip all

      - name: Create release notes
        run: |
          echo "$CHANGELOG" > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md << 'EOF'

          <!-- changelog-end -->

          > **Beta release** — may be unstable. Switch to the Stable channel in Config for production use.
          EOF
        env:
          CHANGELOG: ${{ steps.git-cliff.outputs.content }}

      - name: Create Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          draft: ${{ inputs.dry_run == true }}
          prerelease: true
          files: |
            artifacts/**/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
