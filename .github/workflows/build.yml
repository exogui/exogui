name: Build on demand

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: macOS
        type: choice
        options:
          - macOS
          - Linux
          - Windows
          - All

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.name }}
    if: ${{ github.event.inputs.platform == 'macOS' || github.event.inputs.platform == 'All' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            script: release:mac-arm64
            artifact-name: macOS-artifacts
            artifact-pattern: |
              dist/*.dmg
              dist/latest-mac.yml

          - name: macOS (Legacy)
            runner: macos-15-intel
            script: release:mac-x64
            electron-version: '37'
            legacy: true
            artifact-name: macOS-Legacy-artifacts
            artifact-pattern: dist/*-x86.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Disable code signing
        run: |
          printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/codesign
          chmod +x /usr/local/bin/codesign

      - name: Install legacy Electron
        if: matrix.electron-version
        run: npm install electron@${{ matrix.electron-version }} --save-dev

      - run: npm run ${{ matrix.script }}

      - name: Rename x86 artifacts
        if: matrix.legacy
        run: |
          for f in dist/*.dmg; do
            base="${f%.dmg}"
            base="${base%-x64}"
            mv "$f" "${base}-x86.dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: warn
          retention-days: 7

  build-linux:
    name: Build Linux (x64)
    if: ${{ github.event.inputs.platform == 'Linux' || github.event.inputs.platform == 'All' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run release:linux

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-x64-artifacts
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: warn
          retention-days: 7

  build-linux-arm64:
    name: Build Linux (arm64)
    if: ${{ github.event.inputs.platform == 'Linux' || github.event.inputs.platform == 'All' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run release:linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-arm64-artifacts
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/latest-linux-arm64.yml
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: Build Windows
    if: ${{ github.event.inputs.platform == 'Windows' || github.event.inputs.platform == 'All' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run release:win32

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
          if-no-files-found: warn
          retention-days: 7
