name: Build on demand

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: macOS
        type: choice
        options:
          - macOS
          - Linux
          - Windows
          - All

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.name }}
    if: ${{ github.event.inputs.platform == 'macOS' || github.event.inputs.platform == 'All' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            runner: macos-latest
            script: release:mac-universal
            mac-universal: true
            artifact-name: macOS-artifacts
            artifact-pattern: |
              dist/*.dmg
              dist/latest-mac.yml

          - name: macOS (Legacy)
            runner: macos-15-intel
            script: release:mac-legacy
            electron-version: '37'
            artifact-name: macOS-Legacy-artifacts
            artifact-pattern: dist/exogui-legacy-*.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ${{ matrix.name }}
        uses: ./.github/actions/build-app
        with:
          node-version: '20'
          script: ${{ matrix.script }}
          electron-version: ${{ matrix.electron-version }}
          mac-universal: ${{ matrix.mac-universal }}
          arch-suffix: ${{ matrix.arch-suffix }}
          disable-codesign: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: warn
          retention-days: 7

  build-linux:
    name: Build Linux (x64)
    if: ${{ github.event.inputs.platform == 'Linux' || github.event.inputs.platform == 'All' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Linux (x64)
        uses: ./.github/actions/build-app
        with:
          node-version: '20'
          script: release:linux

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-x64-artifacts
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: warn
          retention-days: 7

  build-linux-arm64:
    name: Build Linux (arm64)
    if: ${{ github.event.inputs.platform == 'Linux' || github.event.inputs.platform == 'All' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Linux (arm64)
        uses: ./.github/actions/build-app
        with:
          node-version: '20'
          script: release:linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-arm64-artifacts
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/latest-linux-arm64.yml
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: Build Windows
    if: ${{ github.event.inputs.platform == 'Windows' || github.event.inputs.platform == 'All' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Windows
        uses: ./.github/actions/build-app
        with:
          node-version: '20'
          script: release:windows

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
          if-no-files-found: warn
          retention-days: 7
