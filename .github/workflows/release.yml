name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & package only — draft release, no version bump/push'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: Bump Version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'skip-release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Strip beta suffix for stable release
        id: bump
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version.replace(/-.*$/, '')")
          npm version "${VERSION}" --no-git-tag-version
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run — skipping commit & push of ${VERSION}"
          else
            git add package.json package-lock.json
            git commit -m "chore: bump version to ${VERSION}"
            git push origin master
          fi

  sync-downstream:
    name: Sync beta and develop with master
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Merge master into beta and develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin beta develop
          for branch in beta develop; do
            git checkout "$branch"
            git merge origin/master --ff-only
            git push origin "$branch"
          done

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            script: release:linux
            artifact-pattern: |
              dist/*.tar.gz
              dist/*.AppImage
              dist/latest-linux.yml

          - name: Linux arm64
            runner: ubuntu-24.04-arm
            script: release:linux-arm64
            artifact-pattern: |
              dist/*.tar.gz
              dist/*.AppImage
              dist/latest-linux-arm64.yml

          - name: Windows
            runner: windows-latest
            script: release:windows
            artifact-pattern: |
              dist/*.exe
              dist/*.zip
              dist/latest.yml

          - name: macOS universal
            runner: macos-latest
            script: release:mac-universal
            mac-universal: true
            artifact-pattern: |
              dist/*.dmg
              dist/latest-mac.yml

          - name: macOS x86_legacy
            runner: macos-15-intel
            script: release:mac-x64
            electron-version: '37'
            arch-suffix: x86_legacy
            artifact-pattern: dist/*-x86_legacy.dmg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Build ${{ matrix.name }}
        uses: ./.github/actions/build-app
        with:
          script: ${{ matrix.script }}
          electron-version: ${{ matrix.electron-version }}
          mac-universal: ${{ matrix.mac-universal }}
          arch-suffix: ${{ matrix.arch-suffix }}

      - name: List dist directory
        shell: bash
        run: ls -la dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip all --tag-pattern "^v[0-9]+\.[0-9]+\.[0-9]+$"

      - name: Create release notes
        run: |
          echo "$CHANGELOG" > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md << 'EOF'

          <!-- changelog-end -->
          EOF
        env:
          CHANGELOG: ${{ steps.git-cliff.outputs.content }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          draft: ${{ inputs.dry_run == true }}
          prerelease: false
          files: |
            artifacts/**/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
